name: Deploy OpenDRT asset pack

on:
  push:
    branches: [main]
  workflow_dispatch:

# Git Pages deployment with the built asset pack as the web root.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pixi (locked env with bpy 5.2.3 wheel)
        uses: prefix-dev/setup-pixi@v0.9.0
        with:
          frozen: true

      # Blend + listing + landing page all from the pixi env: the remote
      # listing generator is pure Python (_bpy_internal), called in-process
      # from the same bpy wheel - no Blender binary needed.

      - name: Build blend + asset pack listing
        run: pixi run build-nodes

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact (dist = asset library root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4